<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8D%A3%3C/text%3E%3C/svg%3E" />
<title>Sushi Paws — From street cat to sushi legend</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #f6ead2;
    font-family: "Hiragino Maru Gothic ProN", "Quicksand", ui-rounded, "Nunito", system-ui, sans-serif;
    color: #3b2f26;
    -webkit-font-smoothing: antialiased;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---------------------------------------------------------------- start */
  #start {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center;
    background: radial-gradient(120% 90% at 50% 8%, #ffe9c4 0%, #f3cf9c 42%, #e0a878 100%);
    transition: opacity .5s ease;
  }
  #start.gone { opacity: 0; pointer-events: none; }
  #start .mark {
    font-size: 74px; line-height: 1;
    filter: drop-shadow(0 6px 0 rgba(140, 90, 50, .18));
    animation: bob 3.2s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg) } 50% { transform: translateY(-10px) rotate(3deg) } }
  #start h1 {
    margin: 0; font-size: clamp(38px, 7vw, 68px); font-weight: 900; letter-spacing: .01em;
    color: #b8412f;
    text-shadow: 0 3px 0 #fff6e4, 0 8px 20px rgba(140, 70, 40, .22);
  }
  #start .tag { margin: -6px 0 6px; font-size: clamp(14px, 2.2vw, 19px); font-weight: 700; color: #7a5741; }
  #start .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
  #start button {
    font-family: inherit; font-weight: 800; font-size: 16px;
    padding: 12px 30px; border-radius: 16px; cursor: pointer;
    border: 2px solid rgba(80, 45, 30, .18);
    background: linear-gradient(180deg, #fff8ea, #f4e2bd);
    color: #3b2f26; box-shadow: 0 5px 0 rgba(120, 75, 45, .28);
    transition: transform .08s, box-shadow .08s, filter .12s;
  }
  #start button:hover { filter: brightness(1.05); }
  #start button:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(120, 75, 45, .28); }
  #start button.primary { background: linear-gradient(180deg, #e0765d, #c8503f); color: #fff6ec; border-color: rgba(0,0,0,.14); }
  #start .hints {
    margin-top: 18px; font-size: 13px; font-weight: 700; color: #7a5741;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 6px 18px; max-width: 620px; padding: 0 20px;
  }
  #start .hints kbd {
    display: inline-block; background: #3b2f26; color: #f6ead2;
    border-radius: 6px; padding: 1px 7px; font-family: inherit; font-size: 12px; margin-right: 5px;
  }
  #start .loading { font-size: 14px; font-weight: 700; color: #8a6448; }
  #start.ready .loading { display: none; }
  #start:not(.ready) .btns, #start:not(.ready) .hints { display: none; }
  #start .start-error { display: none; color: #a83a2a; font-weight: 800; max-width: 480px; padding: 0 20px; }
  #start .build { position: absolute; bottom: 12px; right: 14px; font-size: 11px; font-weight: 700; color: rgba(90,60,40,.5); }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="start">
    <div class="mark">🍣</div>
    <h1>Sushi&nbsp;Paws</h1>
    <div class="tag">From street cat to sushi legend.</div>
    <div class="loading">Warming the rice…</div>
    <p class="start-error"></p>
    <div class="btns">
      <button id="start-continue" class="primary">Continue</button>
      <button id="start-new">New Game</button>
    </div>
    <div class="hints">
      <div><kbd>WASD</kbd>Move</div>
      <div><kbd>Shift</kbd>Run</div>
      <div><kbd>Space</kbd>Jump</div>
      <div><kbd>E</kbd>Interact</div>
      <div><kbd>I</kbd>Basket</div>
      <div><kbd>R</kbd>Recipes</div>
      <div><kbd>Q</kbd>Journal</div>
      <div><kbd>M</kbd>Map</div>
      <div><kbd>F</kbd>Meow</div>
      <div><kbd>G</kbd>Sit</div>
      <div><kbd>Esc</kbd>Menu</div>
      <div><kbd>Drag</kbd>Look</div>
    </div>
    <div class="build">v0.3.0</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
